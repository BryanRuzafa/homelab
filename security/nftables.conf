#!/usr/sbin/nft -f
# Firewall del host. NO usar "flush ruleset": borraria las tablas de Docker, Tailscale y CrowdSec.
table inet host_fw
delete table inet host_fw

table inet host_fw {
    set admin_v4 {
        type ipv4_addr
        elements = { 198.51.100.7 }   # casa (ayuda anti-lockout, no es la proteccion principal)
    }

    # IPs de Cloudflare (generado por /usr/local/sbin/update-cloudflare-ips)
    include "/etc/nftables.d/cloudflare-sets.nft"

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # Red privada Tailscale: acceso de administracion desde cualquier dispositivo propio
        iifname "tailscale0" accept
        ip saddr @admin_v4 accept

        # ICMP / ICMPv6 (necesario para IPv6 ND y PMTU)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # DHCP / DHCPv6 cliente (Hetzner)
        udp dport 68 accept
        ip6 saddr fe80::/10 udp dport 546 accept

        # Tailscale (conexiones directas P2P)
        udp dport 41641 accept

        # SSH: solo via Tailscale (tailscale0) o IP de casa (admin_v4). Cerrado a Internet.

        # Web publica: solo a traves de Cloudflare (la IP real queda oculta)
        ip saddr @cf_v4 tcp dport { 80, 443 } accept
        ip6 saddr @cf_v6 tcp dport { 80, 443 } accept

        limit rate 5/minute log prefix "nft-drop: " level info
    }
}
