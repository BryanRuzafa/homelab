server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	# Peticiones por IP o dominios desconocidos: cerrar sin responder.
	return 444;
}

server {
    server_name bryanrg.dev; # managed by Certbot
	# Cifras públicas de CrowdSec (contador en vivo del portfolio). Las genera crowdsec-public-stats cada minuto.
	location = /stats/crowdsec.json {
		alias /var/www/stats/crowdsec.json;
		default_type application/json;
		add_header Cache-Control "public, max-age=30" always;
		add_header X-Content-Type-Options "nosniff" always;
	}
	# Politica de privacidad estatica (requerida por Google para la app OAuth del asistente)
	location = /privacidad {
		alias /var/www/legal/privacidad.html;
		default_type text/html;
	}

	# Portfolio (Next.js) en Docker: /opt/portfolio, contenedor "portfolio" en 127.0.0.1:3000
	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# El límite de envíos del formulario usa esta cabecera para saber la IP real.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

    listen 203.0.113.10:443 ssl; # managed by Certbot (solo IP publica: 443 de tailscale0 es para tailscale serve)
    listen [2001:db8::10]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bryanrg.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bryanrg.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bryanrg.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
	listen 80 ;
	listen [::]:80 ;
    server_name bryanrg.dev;
    return 404; # managed by Certbot
}
