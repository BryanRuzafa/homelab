# HTTPS por IP o con un nombre desconocido: rechazar el handshake TLS
# (no se muestra el certificado, asi un escaner no descubre bryanrg.dev).
server {
    listen 203.0.113.10:443 ssl default_server;
    listen [2001:db8::10]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
